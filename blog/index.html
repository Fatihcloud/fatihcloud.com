our application. This guide will walk you through the process of setting up OAuth 2.0 authorization and fetching your first piece of data from Spotify&#39;s vast music library.&quot;],&quot;date&quot;:[3,&quot;2024-07-31T21:00:00.000Z&quot;],&quot;tags&quot;:[1,[[0,&quot;Spotify API&quot;],[0,&quot;OAuth 2.0&quot;],[0,&quot;REST API&quot;],[0,&quot;Web Development&quot;]]],&quot;draft&quot;:[0,false]}],&quot;body&quot;:[0,&quot;## Introduction\r\n\r\nIn today&#39;s digital age, music is an integral part of many applications. Whether you&#39;re building a playlist generator, a music discovery tool, or just a personal project, the Spotify API offers a treasure trove of data that you can leverage. However, accessing this data isn&#39;t as simple as making a request to a URL. Spotify&#39;s API requires a secure authorization process to ensure that users&#39; data is protected.\r\n\r\nIn this blog post, I’ll guide you through the process of connecting to the Spotify API using OAuth 2.0, a robust authentication protocol. By the end of this tutorial, you’ll have a working setup that allows you to fetch music data like the currently playing track, recently played songs, and more.\r\n\r\n## Step 1: Understanding OAuth 2.0 and Why It Matters\r\n\r\nBefore diving into the technical steps, it&#39;s important to understand why OAuth 2.0 is essential. OAuth 2.0 is an industry-standard protocol for authorization. It allows third-party applications to access users&#39; data without exposing their login credentials. In the context of Spotify, this means that your application can access a user&#39;s playlists, favorite tracks, and other data while ensuring that the user&#39;s personal information remains secure.\r\n\r\nThe OAuth process involves several steps:\r\n\r\n1. **User Authorization:** The user grants your application permission to access specific data.\r\n2. **Authorization Code:** Once permission is granted, Spotify provides an authorization code.\r\n3. **Access Token:** Your application exchanges the authorization code for an access token, which is used to make authorized API requests.\r\n4. **Refreshing Tokens:** Since access tokens expire, you can use a refresh token to obtain a new access token without requiring the user to log in again.\r\n\r\nNow, let’s get into the details of setting this up.\r\n\r\n## Step 2: Setting Up Your Spotify Developer Account\r\n\r\nTo start using the Spotify API, you need to create a Spotify Developer account. This account will allow you to register your application and obtain the necessary credentials.\r\n\r\n1. **Sign Up:** Visit the [Spotify Developer Dashboard](https://developer.spotify.com/dashboard/applications) and sign in with your Spotify account.\r\n2. **Create an Application:** Click on “Create an App,” give it a name, and fill in the necessary details. The redirect URI is crucial—this is where Spotify will send the authorization code after the user grants permission.\r\n\r\n## Step 3: Building the Authorization URL\r\n\r\nWith your Spotify Developer credentials in hand, the next step is to build the URL that will direct users to Spotify’s authorization page. This URL will include your application&#39;s `client_id`, the required `scopes` (permissions), and the `redirect_uri`.\r\n\r\nHere’s an example of what that URL might look like:\r\n\r\n```text\r\nhttps://accounts.spotify.com/authorize\r\n  ?response_type=code\r\n  &amp;client_id=YOUR_CLIENT_ID\r\n  &amp;scope=user-read-playback-state%20user-read-recently-played\r\n  &amp;redirect_uri=YOUR_REDIRECT_URI\r\n  &amp;state=some_state\r\n```\r\n\r\n### Breaking Down the URL:\r\n\r\n- **`client_id`:** Your application&#39;s unique identifier, provided by Spotify.\r\n- **`scope`:** A space-separated list of permissions your application is requesting. For instance, `user-read-recently-played` allows your app to access the user’s recently played tracks.\r\n- **`redirect_uri`:** The URL to which Spotify will redirect the user after authorization. This must match the redirect URI you specified in your Spotify Developer Dashboard.\r\n\r\n## Step 4: Handling the Authorization Code\r\n\r\nAfter the user grants permission, Spotify will redirect them to your `redirect_uri` with a `code` parameter in the URL. This authorization code is your key to the kingdom—use it to request an access token.\r\n\r\nHere’s how you can do this using JavaScript:\r\n\r\n```javascript\r\nconst client_id = &#39;YOUR_CLIENT_ID&#39;;\r\nconst client_secret = &#39;YOUR_CLIENT_SECRET&#39;;\r\nconst redirect_uri = &#39;https://your-redirect-uri.com/callback&#39;;\r\nconst code = &#39;AUTHORIZATION_CODE_FROM_URL&#39;;\r\n\r\nasync function getAccessToken() {\r\n  const response = await fetch(&#39;https://accounts.spotify.com/api/token&#39;, {\r\n    method: &#39;POST&#39;,\r\n    headers: {\r\n      &#39;Content-Type&#39;: &#39;application/x-www-form-urlencoded&#39;,\r\n      &#39;Authorization&#39;: &#39;Basic &#39; + btoa(client_id + &#39;:&#39; + client_secret)\r\n    },\r\n    body: new URLSearchParams({\r\n      grant_type: &#39;authorization_code&#39;,\r\n      code: code,\r\n      redirect_uri: redirect_uri\r\n    })\r\n  });\r\n\r\n  if (response.ok) {\r\n    const data = await response.json();\r\n    console.log(&#39;Access Token:&#39;, data.access_token);\r\n    console.log(&#39;Refresh Token:&#39;, data.refresh_token);\r\n\r\n    // Use the access token to make API requests\r\n  } else {\r\n    console.error(&#39;Error fetching access token:&#39;, response.status, await response.text());\r\n  }\r\n}\r\n```\r\n\r\n### What Happens Here?\r\n\r\n- **Authorization Code:** Retrieved from the URL after the user is redirected back to your application.\r\n- **Access Token:** The key that allows your app to make API requests on behalf of the user.\r\n- **Refresh Token:** A token used to refresh the access token when it expires, ensuring continuous access.\r\n\r\n## Step 5: Making Your First API Request\r\n\r\nWith the access token in hand, you can now start interacting with the Spotify API. Let’s fetch the currently playing track:\r\n\r\n```javascript\r\nasync function fetchCurrentlyPlaying(accessToken) {\r\n  const response = await fetch(\&quot;https://api.spotify.com/v1/me/player/currently-playing\&quot;, {\r\n    headers: {\r\n      Authorization: `Bearer ${accessToken}`\r\n    }\r\n  });\r\n\r\n  if (response.ok) {\r\n    const data = await response.json();\r\n    console.log(\&quot;Currently Playing:\&quot;, data);\r\n  } else {\r\n    console.error(\&quot;Error fetching currently playing song:\&quot;, response.status, await response.text());\r\n  }\r\n}\r\n```\r\n\r\n### What Can You Do With the Data?\r\n\r\nOnce you have the data, you can display the currently playing track in your application, create dynamic playlists, or even build a music visualization tool. The possibilities are endless!\r\n\r\n## Step 6: Handling Token Expiration\r\n\r\nAccess tokens expire after a set period (typically one hour). When this happens, your application needs to request a new access token using the refresh token.\r\n\r\nHere’s how you can handle token expiration:\r\n\r\n```javascript\r\nasync function refreshAccessToken(refreshToken) {\r\n  const response = await fetch(&#39;https://accounts.spotify.com/api/token&#39;, {\r\n    method: &#39;POST&#39;,\r\n    headers: {\r\n      &#39;Content-Type&#39;: &#39;application/x-www-form-urlencoded&#39;,\r\n      &#39;Authorization&#39;: &#39;Basic &#39; + btoa(client_id + &#39;:&#39; + client_secret)\r\n    },\r\n    body: new URLSearchParams({\r\n      grant_type: &#39;refresh_token&#39;,\r\n      refresh_token: refreshToken\r\n    })\r\n  });\r\n\r\n  if (response.ok) {\r\n    const data = await response.json();\r\n    console.log(&#39;New Access Token:&#39;, data.access_token);\r\n    return data.access_token;\r\n  } else {\r\n    console.error(&#39;Error refreshing access token:&#39;, response.status, await response.text());\r\n  }\r\n}\r\n```\r\n\r\n## Conclusion\r\n\r\nCongratulations! You&#39;ve just set up OAuth 2.0 with Spotify API and made your first data request. The process of integrating Spotify&#39;s vast library into your app opens up a world of possibilities, from creating personalized music experiences to building advanced data-driven applications.\r\n\r\nWith the power of the Spotify API, you can bring music to life in your projects. Whether you’re building for fun or for a larger audience, understanding how to securely access and use music data is an invaluable skill in today’s development landscape.\r\n\r\nNow that you’ve taken the first step, what will you build next? The stage is yours!&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/01-spotify.md/index.md&quot;],&quot;digest&quot;:[0,&quot;02ae900bb3480246&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;introduction\&quot;&gt;Introduction&lt;/h2&gt;\n&lt;p&gt;In today’s digital age, music is an integral part of many applications. Whether you’re building a playlist generator, a music discovery tool, or just a personal project, the Spotify API offers a treasure trove of data that you can leverage. However, accessing this data isn’t as simple as making a request to a URL. Spotify’s API requires a secure authorization process to ensure that users’ data is protected.&lt;/p&gt;\n&lt;p&gt;In this blog post, I’ll guide you through the process of connecting to the Spotify API using OAuth 2.0, a robust authentication protocol. By the end of this tutorial, you’ll have a working setup that allows you to fetch music data like the currently playing track, recently played songs, and more.&lt;/p&gt;\n&lt;h2 id=\&quot;step-1-understanding-oauth-20-and-why-it-matters\&quot;&gt;Step 1: Understanding OAuth 2.0 and Why It Matters&lt;/h2&gt;\n&lt;p&gt;Before diving into the technical steps, it’s important to understand why OAuth 2.0 is essential. OAuth 2.0 is an industry-standard protocol for authorization. It allows third-party applications to access users’ data without exposing their login credentials. In the context of Spotify, this means that your application can access a user’s playlists, favorite tracks, and other data while ensuring that the user’s personal information remains secure.&lt;/p&gt;\n&lt;p&gt;The OAuth process involves several steps:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;User Authorization:&lt;/strong&gt; The user grants your application permission to access specific data.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Authorization Code:&lt;/strong&gt; Once permission is granted, Spotify provides an authorization code.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Access Token:&lt;/strong&gt; Your application exchanges the authorization code for an access token, which is used to make authorized API requests.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Refreshing Tokens:&lt;/strong&gt; Since access tokens expire, you can use a refresh token to obtain a new access token without requiring the user to log in again.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Now, let’s get into the details of setting this up.&lt;/p&gt;\n&lt;h2 id=\&quot;step-2-setting-up-your-spotify-developer-account\&quot;&gt;Step 2: Setting Up Your Spotify Developer Account&lt;/h2&gt;\n&lt;p&gt;To start using the Spotify API, you need to create a Spotify Developer account. This account will allow you to register your application and obtain the necessary credentials.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Sign Up:&lt;/strong&gt; Visit the &lt;a href=\&quot;https://developer.spotify.com/dashboard/applications\&quot;&gt;Spotify Developer Dashboard&lt;/a&gt; and sign in with your Spotify account.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Create an Application:&lt;/strong&gt; Click on “Create an App,” give it a name, and fill in the necessary details. The redirect URI is crucial—this is where Spotify will send the authorization code after the user grants permission.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;step-3-building-the-authorization-url\&quot;&gt;Step 3: Building the Authorization URL&lt;/h2&gt;\n&lt;p&gt;With your Spotify Developer credentials in hand, the next step is to build the URL that will direct users to Spotify’s authorization page. This URL will include your application’s &lt;code&gt;client_id&lt;/code&gt;, the required &lt;code&gt;scopes&lt;/code&gt; (permissions), and the &lt;code&gt;redirect_uri&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Here’s an example of what that URL might look like:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;text\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;https://accounts.spotify.com/authorize&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;  ?response_type=code&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;  &amp;#x26;client_id=YOUR_CLIENT_ID&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;  &amp;#x26;scope=user-read-playback-state%20user-read-recently-played&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;  &amp;#x26;redirect_uri=YOUR_REDIRECT_URI&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span&gt;  &amp;#x26;state=some_state&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h3 id=\&quot;breaking-down-the-url\&quot;&gt;Breaking Down the URL:&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;client_id&lt;/code&gt;:&lt;/strong&gt; Your application’s unique identifier, provided by Spotify.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;scope&lt;/code&gt;:&lt;/strong&gt; A space-separated list of permissions your application is requesting. For instance, &lt;code&gt;user-read-recently-played&lt;/code&gt; allows your app to access the user’s recently played tracks.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;redirect_uri&lt;/code&gt;:&lt;/strong&gt; The URL to which Spotify will redirect the user after authorization. This must match the redirect URI you specified in your Spotify Developer Dashboard.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;step-4-handling-the-authorization-code\&quot;&gt;Step 4: Handling the Authorization Code&lt;/h2&gt;\n&lt;p&gt;After the user grants permission, Spotify will redirect them to your &lt;code&gt;redirect_uri&lt;/code&gt; with a &lt;code&gt;code&lt;/code&gt; parameter in the URL. This authorization code is your key to the kingdom—use it to request an access token.&lt;/p&gt;\n&lt;p&gt;Here’s how you can do this using JavaScript:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;javascript\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; client_id&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; &#39;YOUR_CLIENT_ID&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; client_secret&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; &#39;YOUR_CLIENT_SECRET&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; redirect_uri&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; &#39;https://your-redirect-uri.com/callback&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; code&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; &#39;AUTHORIZATION_CODE_FROM_URL&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;async&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; function&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; getAccessToken&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;() {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;  const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; response&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; await&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; fetch&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;https://accounts.spotify.com/api/token&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    method: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;POST&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    headers: {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;      &#39;Content-Type&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;application/x-www-form-urlencoded&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;      &#39;Authorization&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;Basic &#39;&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; +&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; btoa&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(client_id &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;+&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; &#39;:&#39;&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; +&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; client_secret)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    },&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    body: &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;new&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; URLSearchParams&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;({&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;      grant_type: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;authorization_code&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;      code: code,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;      redirect_uri: redirect_uri&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    })&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  });&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;  if&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; (response.ok) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;    const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; data&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; await&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; response.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;json&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    console.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;log&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;Access Token:&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, data.access_token);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    console.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;log&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;Refresh Token:&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, data.refresh_token);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D\&quot;&gt;    // Use the access token to make API requests&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  } &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;else&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    console.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;error&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;Error fetching access token:&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, response.status, &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;await&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; response.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;text&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;());&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h3 id=\&quot;what-happens-here\&quot;&gt;What Happens Here?&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Authorization Code:&lt;/strong&gt; Retrieved from the URL after the user is redirected back to your application.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Access Token:&lt;/strong&gt; The key that allows your app to make API requests on behalf of the user.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Refresh Token:&lt;/strong&gt; A token used to refresh the access token when it expires, ensuring continuous access.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;step-5-making-your-first-api-request\&quot;&gt;Step 5: Making Your First API Request&lt;/h2&gt;\n&lt;p&gt;With the access token in hand, you can now start interacting with the Spotify API. Let’s fetch the currently playing track:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;javascript\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;async&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; function&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; fetchCurrentlyPlaying&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#FFAB70\&quot;&gt;accessToken&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;  const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; response&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; await&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; fetch&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;https://api.spotify.com/v1/me/player/currently-playing\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    headers: {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;      Authorization: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;`Bearer ${&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;accessToken&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;}`&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  });&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;  if&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; (response.ok) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;    const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; data&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; await&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; response.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;json&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    console.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;log&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;Currently Playing:\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, data);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  } &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;else&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    console.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;error&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;\&quot;Error fetching currently playing song:\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, response.status, &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;await&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; response.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;text&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;());&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h3 id=\&quot;what-can-you-do-with-the-data\&quot;&gt;What Can You Do With the Data?&lt;/h3&gt;\n&lt;p&gt;Once you have the data, you can display the currently playing track in your application, create dynamic playlists, or even build a music visualization tool. The possibilities are endless!&lt;/p&gt;\n&lt;h2 id=\&quot;step-6-handling-token-expiration\&quot;&gt;Step 6: Handling Token Expiration&lt;/h2&gt;\n&lt;p&gt;Access tokens expire after a set period (typically one hour). When this happens, your application needs to request a new access token using the refresh token.&lt;/p&gt;\n&lt;p&gt;Here’s how you can handle token expiration:&lt;/p&gt;\n&lt;pre class=\&quot;astro-code github-dark\&quot; style=\&quot;background-color:#24292e;color:#e1e4e8; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;javascript\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;async&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; function&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; refreshAccessToken&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#FFAB70\&quot;&gt;refreshToken&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;  const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; response&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; await&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; fetch&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;https://accounts.spotify.com/api/token&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    method: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;POST&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    headers: {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;      &#39;Content-Type&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;application/x-www-form-urlencoded&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;      &#39;Authorization&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;Basic &#39;&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; +&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; btoa&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(client_id &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;+&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt; &#39;:&#39;&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; +&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; client_secret)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    },&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    body: &lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;new&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt; URLSearchParams&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;({&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;      grant_type: &lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;refresh_token&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;      refresh_token: refreshToken&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    })&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;  });&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;  if&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; (response.ok) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;    const&lt;/span&gt;&lt;span style=\&quot;color:#79B8FF\&quot;&gt; data&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt; await&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; response.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;json&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;();&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;    console.&lt;/span&gt;&lt;span style=\&quot;color:#B392F0\&quot;&gt;log&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#9ECBFF\&quot;&gt;&#39;New Access Token:&#39;&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt;, data.access_token);&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#F97583\&quot;&gt;    return&lt;/span&gt;&lt;span style=\&quot;color:#E1E4E8\&quot;&gt; data.access_token;&lt;/span&gt;&lt
